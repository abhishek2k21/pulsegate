# ============================================================
# Test Profile — application-test.yml
# Used by Testcontainers integration tests.
# Testcontainers overrides DB/Redis/Kafka URLs via DynamicPropertySource.
# ============================================================

spring:
  flyway:
    baseline-on-migrate: true
    clean-on-validation-error: true   # Allow Flyway to clean test DB between runs

  kafka:
    consumer:
      auto-offset-reset: earliest

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ""   # Disabled for tests

logging:
  level:
    com.pulsegate: DEBUG
    org.testcontainers: INFO
    tc: INFO
