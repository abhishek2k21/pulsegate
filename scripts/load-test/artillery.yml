config:
  target: "http://localhost:8080"
  phases:
    - duration: 20
      arrivalRate: 20
      name: "Warm-up phase"
    - duration: 60
      arrivalRate: 100
      rampTo: 500
      name: "Peak burst stress test (500 req/s)"
    - duration: 30
      arrivalRate: 50
      name: "Cool-down phase"
  defaults:
    headers:
      Content-Type: "application/json"
      X-API-Key: "artillery-load-client"

scenarios:
  - name: "Proxy through PulseGate to Upstream Service"
    flow:
      - get:
          url: "/api/v1/orders/101"
          capture:
            - header: "x-correlation-id"
              as: "correlationId"
            - header: "x-ratelimit-remaining"
              as: "rateRemaining"
      - think: 0.05
